[build]
  command = "npm run build"
  publish = "dist"

# Enable SPA Client Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and Audio Hardware Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Ensure microphone access is permitted on Netlify domain
    Permissions-Policy = "microphone=(self), speaker-selection=(self)"
